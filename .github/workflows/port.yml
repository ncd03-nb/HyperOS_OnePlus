name: Build HyperOS 4 for OnePlus 13

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "OnePlus 13 stock ROM link (full OTA/fastboot zip or payload.bin) — source of vendor + odm"
        required: true
        type: string
      hos4_url:
        description: "HyperOS 4 ROM link (full recovery/OTA zip or payload.bin) — source of system + system_ext + product"
        required: true
        type: string
      name:
        description: "Output name for the flashable zip"
        required: false
        default: "HyperOS4-OnePlus13-port"
        type: string
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs the PIXELDRAIN_API_KEY secret)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build port
        run: |
          ./port.sh --stock "${{ inputs.stock_url }}" --hos4 "${{ inputs.hos4_url }}" --name "${{ inputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then
            echo "::warning::Upload to pixeldrain is on but the PIXELDRAIN_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions. The build zip is still available as a workflow artifact above."
            exit 0
          fi
          ZIP="$(ls out/*.zip | head -n1)"
          BASENAME="$(basename "$ZIP")"
          echo "uploading $BASENAME ($(du -h "$ZIP" | cut -f1)) to pixeldrain"

          # The simple PUT /api/file endpoint caps file size by plan and rejects
          # a full ROM zip with file_too_large. rclone's pixeldrain backend uses
          # pixeldrain's filesystem (Pro / Prepaid), which chunk-uploads large
          # files. Ubuntu's apt rclone predates that backend, so install latest.
          if ! rclone version 2>/dev/null | grep -q pixeldrain 2>/dev/null; then
            curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y rclone
          fi
          export RCLONE_CONFIG_PD_TYPE=pixeldrain
          export RCLONE_CONFIG_PD_API_KEY="$PIXELDRAIN_API_KEY"
          export RCLONE_CONFIG_PD_ROOT_FOLDER_ID=me

          if rclone copy --stats-one-line --stats 30s "$ZIP" pd:/ ; then
            LINK="$(rclone link "pd:/$BASENAME" 2>/dev/null || true)"
            if [ -n "$LINK" ]; then
              echo "pixeldrain: $LINK"
              echo "### Pixeldrain: [$BASENAME]($LINK)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "uploaded to your pixeldrain filesystem as $BASENAME (share it from https://pixeldrain.com/filesystem)"
              echo "### Uploaded to your pixeldrain filesystem: \`$BASENAME\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # never fail the build over the upload: the zip is already an artifact
            echo "::warning::rclone pixeldrain upload failed. The zip is still available as a workflow artifact above. (The pixeldrain filesystem needs a Pro or Prepaid plan.)"
          fi
