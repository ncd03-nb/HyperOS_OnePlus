name: Build HyperOS for OnePlus

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device"
        required: true
        type: choice
        options:
          - PJZ110
          - PLK110
      stock_url:
        description: "OnePlus stock ROM link for that device (full OTA/fastboot zip or payload.bin)"
        required: true
        type: string
      hyperos_url:
        description: "HyperOS ROM link (HyperOS 2 to 4, full recovery/OTA zip or payload.bin)"
        required: true
        type: string
      name:
        description: "Output name for the flashable zip (optional)"
        required: false
        default: ""
        type: string
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs PIXELDRAIN_API_KEY)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build port
        run: |
          ARGS=(--device "${{ inputs.device }}" --stock "${{ inputs.stock_url }}" --hyperos "${{ inputs.hyperos_url }}")
          [ -n "${{ inputs.name }}" ] && ARGS+=(--name "${{ inputs.name }}")
          ./port.sh "${ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-${{ inputs.device }}-port
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          [ -n "$PIXELDRAIN_API_KEY" ] || { echo "::warning::PIXELDRAIN_API_KEY not set; skipping upload."; exit 0; }
          ZIP="$(ls out/*.zip | head -n1)"; NAME="$(basename "$ZIP")"
          echo "uploading $NAME ($(du -h "$ZIP" | cut -f1)) to pixeldrain"
          CODE="$(curl -s -w '%{http_code}' -o pd.json -T "$ZIP" -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/filesystem/me/$NAME?make_parents=true")"
          echo "HTTP $CODE: $(cat pd.json 2>/dev/null)"
          case "$CODE" in
            200|201)
              SHARE="$(curl -s -X POST -u ":$PIXELDRAIN_API_KEY" \
                --data-urlencode action=update --data-urlencode shared=true \
                "https://pixeldrain.com/api/filesystem/me/$NAME")"
              ID="$(printf '%s' "$SHARE" | sed -n 's/.*"id"[^"]*"\([^"]*\)".*/\1/p')"
              [ -n "$ID" ] && echo "### Pixeldrain: https://pixeldrain.com/d/$ID" >> "$GITHUB_STEP_SUMMARY" \
                           || echo "::warning::uploaded but no share id in: $SHARE" ;;
            403) echo "::warning::pixeldrain forbidden - the API key may lack filesystem access; regenerate it at pixeldrain.com/user/api_keys. Artifact still available." ;;
            *)   echo "::warning::pixeldrain upload failed (HTTP $CODE). Artifact still available." ;;
          esac
