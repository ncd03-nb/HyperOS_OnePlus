name: Port HyperOS

# The Telegram bot passes request_id so a build can be traced unambiguously in
# Actions. Manual runs still receive a readable fallback name.
run-name: ${{ inputs.request_id || 'HyperOS-auto-detect' }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Optional profile override; leave blank to detect from stock ROM"
        required: false
        default: ""
        type: string
      stock_url:
        description: "OnePlus stock ROM link for that device (full OTA/fastboot zip or payload.bin)"
        required: true
        type: string
      hyperos_url:
        description: "HyperOS ROM link (HyperOS 2 to 4, full recovery/OTA zip or payload.bin)"
        required: true
        type: string
      name:
        description: "Output name for the flashable zip (optional)"
        required: false
        default: ""
        type: string
      request_id:
        description: "Telegram build identifier (optional)"
        required: false
        default: ""
        type: string
      force_adb:
        description: "Force insecure ADB from early boot for bootloop diagnostics"
        required: false
        default: true
        type: boolean
      upload_gdrive:
        description: "Upload completed ROM to Google Drive"
        required: false
        default: true
        type: boolean
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs PIXELDRAIN_API_KEY)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Auto-probe stock ROM
        id: stock_probe
        env:
          STOCK_INPUT: ${{ inputs.stock_url }}
        run: |
          chmod +x scripts/actions_probe_stock.sh
          if ! scripts/actions_probe_stock.sh "$STOCK_INPUT" "$GITHUB_WORKSPACE/.auto_probe"; then
            echo "::warning::Automatic stock-ROM probe failed; continuing with normal profile detection."
            echo "stock_path=$STOCK_INPUT" >> "$GITHUB_OUTPUT"
            echo "probe_conf=" >> "$GITHUB_OUTPUT"
            echo "probe_json=" >> "$GITHUB_OUTPUT"
            echo "probe_report=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare porter for Actions auto-profile/debug
        env:
          FORCE_ADB: ${{ inputs.force_adb }}
        run: |
          python3 scripts/patch_port_for_actions.py port.sh
          echo "Force ADB: $FORCE_ADB"

      - name: Build port
        env:
          AUTO_PROFILE_CONF: ${{ steps.stock_probe.outputs.probe_conf }}
          STOCK_PROBED_PATH: ${{ steps.stock_probe.outputs.stock_path }}
        run: |
          STOCK_INPUT="$STOCK_PROBED_PATH"
          [ -n "$STOCK_INPUT" ] || STOCK_INPUT="${{ inputs.stock_url }}"
          ARGS=(--stock "$STOCK_INPUT" --hyperos "${{ inputs.hyperos_url }}")
          if [ -n "${{ inputs.device }}" ]; then
            [[ "${{ inputs.device }}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid device profile"; exit 1; }
            [ "${{ inputs.device }}" != "_template" ] || { echo "The template is not buildable"; exit 1; }
            [ -f "devices/${{ inputs.device }}/device.conf" ] || { echo "Unknown device profile"; exit 1; }
            ARGS+=(--device "${{ inputs.device }}")
          fi
          [ -n "${{ inputs.name }}" ] && ARGS+=(--name "${{ inputs.name }}")
          ./port.sh "${ARGS[@]}"

      - name: Add stock probe to summary
        if: always()
        env:
          PROBE_REPORT: ${{ steps.stock_probe.outputs.probe_report }}
        run: |
          if [ -n "$PROBE_REPORT" ] && [ -f "$PROBE_REPORT" ]; then
            {
              echo "## Stock ROM auto-probe"
              echo '```text'
              cat "$PROBE_REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## Debug build" >> "$GITHUB_STEP_SUMMARY"
          echo "Force ADB: ${{ inputs.force_adb }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stock probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stock-ROM-probe
          path: .auto_probe/report/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-port
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to Google Drive
        if: ${{ inputs.upload_gdrive }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "::warning::GDRIVE_FOLDER_ID is not configured; skipping Google Drive upload."
            exit 0
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -z "$GOOGLE_OAUTH_CREDENTIALS_JSON" ]; then
            echo "::warning::No Google Drive credentials are configured; skipping Google Drive upload."
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth
          ZIP="$(ls out/*.zip | head -n1)"
          set +e
          GDRIVE_URL="$(python3 scripts/upload_gdrive.py "$ZIP")"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Google Drive upload failed; the GitHub artifact is still available."
          else
            echo "Google Drive upload complete: $GDRIVE_URL"
            echo "### Google Drive: $GDRIVE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          [ -n "$PIXELDRAIN_API_KEY" ] || { echo "::warning::PIXELDRAIN_API_KEY not set; skipping upload."; exit 0; }
          ZIP="$(ls out/*.zip | head -n1)"; NAME="$(basename "$ZIP")"
          echo "uploading $NAME ($(du -h "$ZIP" | cut -f1)) to pixeldrain"
          CODE="$(curl -s -w '%{http_code}' -o pd.json -T "$ZIP" -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/filesystem/me/$NAME?make_parents=true")"
          echo "HTTP $CODE: $(cat pd.json 2>/dev/null)"
          case "$CODE" in
            200|201)
              SHARE="$(curl -s -X POST -u ":$PIXELDRAIN_API_KEY" \
                --data-urlencode action=update --data-urlencode shared=true \
                "https://pixeldrain.com/api/filesystem/me/$NAME")"
              ID="$(printf '%s' "$SHARE" | sed -n 's/.*"id"[^"]*"\([^"]*\)".*/\1/p')"
              [ -n "$ID" ] && echo "### Pixeldrain: https://pixeldrain.com/d/$ID" >> "$GITHUB_STEP_SUMMARY" \
                           || echo "::warning::uploaded but no share id in: $SHARE" ;;
            403) echo "::warning::pixeldrain forbidden - the API key may lack filesystem access; regenerate it at pixeldrain.com/user/api_keys. Artifact still available." ;;
            *)   echo "::warning::pixeldrain upload failed (HTTP $CODE). Artifact still available." ;;
          esac
