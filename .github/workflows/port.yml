name: Build HyperOS for OnePlus 13

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "OnePlus 13 stock ROM link (full OTA/fastboot zip or payload.bin) — source of vendor + odm"
        required: true
        type: string
      hyperos_url:
        description: "HyperOS ROM link (HyperOS 2 to 4, full recovery/OTA zip or payload.bin) — source of system + system_ext + product"
        required: true
        type: string
      name:
        description: "Output name for the flashable zip"
        required: false
        default: "HyperOS-OnePlus13-port"
        type: string
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs the PIXELDRAIN_API_KEY secret)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build port
        run: |
          ./port.sh --stock "${{ inputs.stock_url }}" --hyperos "${{ inputs.hyperos_url }}" --name "${{ inputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then
            echo "::warning::Upload to pixeldrain is on but the PIXELDRAIN_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions. The build zip is still available as a workflow artifact above."
            exit 0
          fi
          ZIP="$(ls out/*.zip | head -n1)"
          NAME="$(basename "$ZIP")"
          echo "uploading $NAME ($(du -h "$ZIP" | cut -f1)) to pixeldrain"

          # The plain PUT /api/file endpoint caps file size and rejects a full
          # ROM zip with file_too_large. The filesystem endpoint (what the web
          # uploader uses) has no per-file cap - only the account storage quota.
          UP_CODE="$(curl -s -w '%{http_code}' -o pd_upload.json \
            -T "$ZIP" -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/filesystem/me/$NAME?make_parents=true")"
          echo "upload HTTP $UP_CODE"; cat pd_upload.json 2>/dev/null; echo
          if [ "$UP_CODE" != "200" ] && [ "$UP_CODE" != "201" ]; then
            echo "::warning::pixeldrain upload failed (HTTP $UP_CODE). The zip is still available as a workflow artifact above."
            exit 0
          fi

          # mark the uploaded file public and read back its share id
          SHARE="$(curl -s -X POST -u ":$PIXELDRAIN_API_KEY" \
            --data-urlencode "action=update" --data-urlencode "shared=true" \
            "https://pixeldrain.com/api/filesystem/me/$NAME")"
          ID="$(printf '%s' "$SHARE" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          if [ -n "$ID" ]; then
            echo "pixeldrain: https://pixeldrain.com/d/$ID"
            echo "### Pixeldrain: https://pixeldrain.com/d/$ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uploaded to your pixeldrain filesystem as $NAME"
            echo "::warning::uploaded, but could not parse a share id from: $SHARE"
            echo "### Uploaded to your pixeldrain filesystem: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          fi
