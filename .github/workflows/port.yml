name: Build HyperOS for OnePlus 13

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "OnePlus 13 stock ROM link (full OTA/fastboot zip or payload.bin) — source of vendor + odm"
        required: true
        type: string
      hyperos_url:
        description: "HyperOS ROM link (HyperOS 2 to 4, full recovery/OTA zip or payload.bin) — source of system + system_ext + product"
        required: true
        type: string
      name:
        description: "Output name for the flashable zip"
        required: false
        default: "HyperOS-OnePlus13-port"
        type: string
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs the PIXELDRAIN_API_KEY secret)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build port
        run: |
          ./port.sh --stock "${{ inputs.stock_url }}" --hyperos "${{ inputs.hyperos_url }}" --name "${{ inputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          [ -n "$PIXELDRAIN_API_KEY" ] || { echo "::warning::PIXELDRAIN_API_KEY not set; skipping upload."; exit 0; }
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get install -y rclone >/dev/null 2>&1
          export RCLONE_CONFIG_PD_TYPE=pixeldrain RCLONE_CONFIG_PD_API_KEY="$PIXELDRAIN_API_KEY" RCLONE_CONFIG_PD_ROOT_FOLDER_ID=me
          ZIP="$(ls out/*.zip | head -n1)"; NAME="$(basename "$ZIP")"
          if rclone copy --stats-one-line --stats 30s "$ZIP" pd:/ ; then
            LINK="$(rclone link "pd:/$NAME" 2>/dev/null || true)"
            [ -z "$LINK" ] || echo "### Pixeldrain: [$NAME]($LINK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pixeldrain upload failed; the Actions artifact is still available."
          fi
