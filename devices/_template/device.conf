# Copy this directory to devices/<profile-name> and replace all placeholders.
# Never use guessed display/FOD values on a real phone.
name=REPLACE_WITH_MARKETING_NAME
model=REPLACE_WITH_STOCK_MODEL
# Optional comma-separated aliases read from OnePlus stock properties. The
# auto-detector tries match_models, match_devices, then model.
match_models=REPLACE_WITH_STOCK_MODEL,OTHER_REGIONAL_MODEL
match_devices=REPLACE_WITH_DEVICE_CODENAME
status=Experimental
density=REPLACE_WITH_DENSITY
miui_resolution=WIDTH,HEIGHT,480
fod_location=X,Y
fod_size=WIDTH,HEIGHT
fod_target=LEFT,TOP,RIGHT,BOTTOM
marketname=REPLACE_WITH_CHINESE_MARKET_NAME
camera_gdrive_id=REPLACE_WITH_MIUI_CAMERA_ARCHIVE_ID
